# 60x40 in version of the grid-aligned Old Toronto poster, for pinning polaroids.
# Same top/bottom as toronto-old-grid.yaml (Lawrence & Weston → Tommy Thompson Park);
# the wider 3:2 page is spent on the west, so New Toronto/Mimico fit and the
# east edge stays just past Victoria Park Ave.
# Render:  python -m poster_map configs/toronto-old-grid-60x40.yaml --preview
output: output/toronto-old-grid-pine-60x40.pdf

area:
  center: [43.66067, -79.41188]
  width_m: 21190
  rotation_deg: 16.4

data:
  source: pbf
  pbf: https://download.bbbike.org/osm/bbbike/Toronto/Toronto.osm.pbf

page:
  size: 60x40in
  orientation: landscape
  margin: 1.667in

text:
  enabled: false

theme: pine

rail: {width: 1.25}
roads:
  scale: 2.5            # 2.5x the 24x18 line weights, so the streets keep the same look at this size
  tiers:
    service:     {width: 0.20}
    residential: {width: 0.40}
    tertiary:    {width: 0.75}
    secondary:   {width: 1.10}
